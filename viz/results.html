<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FourWells Results</title>
<style>
  /* Layout: one column, narrative order. What the pool holds, then the four going to the lab,
     then the whole pool on one axis, then what the gates cost, then every candidate, then what
     the scores rest on.
     Palette: the project's slate neutrals and teal (viz/index.html). Colour does one job,
     polarity, and follows the report: teal where a design is predicted above trastuzumab,
     amber where below, grey where it is context. The teal gained chroma (light) and lost
     lightness (dark) so the pair clears the palette validator in both themes; the S/A/B tier
     ramp is one hue and clears the ordinal checks. */
  :root {
    color-scheme: light;
    --bg: #f7f8f9; --panel: #ffffff; --fg: #15191c; --fg-dim: #5c666e;
    --line: #dfe3e6; --line-soft: #eceff1; --track: #e9edf0; --hl: #e4e9ec;
    --accent: #009387; --accent-ink: #0d7d73; --on-accent: #ffffff; --warn: #a16207;
    --quiet: #7c878f; --grid: #e1e4e6;
    --tier-s: #01544d; --tier-a: #04877c; --tier-b: #04c5b5; --tier-none: #b8c1c8;
    --shadow: 0 6px 24px rgba(15, 19, 22, .16);
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0f1316; --panel: #171c20; --fg: #e8edf0; --fg-dim: #b0bbc2;
      --line: #282f35; --line-soft: #20272c; --track: #242c32; --hl: #2a343b;
      --accent: #1eab9e; --accent-ink: #2bb3a5; --on-accent: #ffffff; --warn: #c38826;
      --quiet: #8a959c; --grid: #262d33;
      --tier-s: #37d8c9; --tier-a: #02a99b; --tier-b: #087970; --tier-none: #46525a;
      --shadow: 0 6px 24px rgba(0, 0, 0, .5);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0f1316; --panel: #171c20; --fg: #e8edf0; --fg-dim: #b0bbc2;
    --line: #282f35; --line-soft: #20272c; --track: #242c32; --hl: #2a343b;
    --accent: #1eab9e; --accent-ink: #2bb3a5; --on-accent: #ffffff; --warn: #c38826;
    --quiet: #8a959c; --grid: #262d33;
    --tier-s: #37d8c9; --tier-a: #02a99b; --tier-b: #087970; --tier-none: #46525a;
    --shadow: 0 6px 24px rgba(0, 0, 0, .5);
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--sans); }
  .wrap {
    max-width: 1120px; margin: 0 auto; padding-block: 32px 64px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .mono, code { font-family: var(--mono); }
  code { font-size: 12.5px; }
  :focus-visible { outline: 2px solid var(--accent-ink); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }

  /* ---- type ---- */
  .eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--fg-dim); font-weight: 650; }
  h1 { font-size: 32px; line-height: 1.12; letter-spacing: -.022em; margin: 6px 0 12px; font-weight: 680; text-wrap: balance; }
  h2 { font-size: 20px; line-height: 1.3; letter-spacing: -.012em; margin: 4px 0 6px; font-weight: 640; max-width: 60ch; text-wrap: balance; }
  h3 { margin: 0; font-size: 15px; font-weight: 650; line-height: 1.3; }
  .lede { font-size: 17px; line-height: 1.5; max-width: 66ch; margin: 0; text-wrap: pretty; }
  .meta, .note { color: var(--fg-dim); font-size: 12.5px; }
  .meta { margin: 12px 0 0; }
  .note { margin: 10px 0 0; max-width: 80ch; }
  section { margin-top: 48px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; min-width: 0; }

  /* ---- headline figures ---- */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; margin-top: 24px; }
  .stat { padding: 12px 14px; }
  .stat .k { font-size: 12px; color: var(--fg-dim); }
  .stat b { display: block; font-size: 28px; line-height: 1.15; font-weight: 660; letter-spacing: -.015em; margin: 2px 0; }
  .stat .s { font-size: 12px; color: var(--fg-dim); }

  /* ---- diverging bar: starts at 0.50, which is trastuzumab ---- */
  .dv { position: relative; height: 10px; background: var(--track); border-radius: 5px; }
  .dv::after { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; background: var(--fg-dim); border-radius: 1px; }
  .dv i { position: absolute; top: 0; bottom: 0; }
  .dv i.pos { background: var(--accent); border-radius: 0 4px 4px 0; }
  .dv i.neg { background: var(--warn); border-radius: 4px 0 0 4px; }
  .dv.sm { width: 64px; height: 8px; display: inline-block; vertical-align: middle; }
  .dv.sm::after { top: -2px; bottom: -2px; }
  .scalekey { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin: 10px 0 16px; font-size: 12.5px; color: var(--fg-dim); }
  .scalekey .dv { width: 150px; flex: none; }

  /* ---- the four ---- */
  .picks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  @media (max-width: 860px) { .picks { grid-template-columns: minmax(0, 1fr); } }
  .pick { padding: 16px 18px 14px; display: flex; flex-direction: column; gap: 14px; }
  .pick-h { display: flex; align-items: flex-start; gap: 12px; }
  .rank { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: inline-grid; place-items: center; font-weight: 700; font-size: 14px; }
  .rank.sm { width: 22px; height: 22px; font-size: 12px; vertical-align: middle; margin-right: 8px; }
  .pick-t { min-width: 0; flex: 1; }
  .pick-t h3 { font-family: var(--mono); font-size: 14px; overflow-wrap: anywhere; }
  .sub { margin: 2px 0 0; font-size: 12px; color: var(--fg-dim); overflow-wrap: anywhere; }
  .pick-j { text-align: right; flex: none; }
  .pick-j b { display: block; font-size: 26px; line-height: 1.05; font-weight: 660; letter-spacing: -.02em; }
  .pick-j span { font-size: 11.5px; color: var(--fg-dim); }

  .align { display: grid; gap: 3px; font-family: var(--mono); font-size: 15px; }
  .al-row { display: flex; align-items: center; gap: 10px; }
  .al-l { width: 86px; flex: none; font: 12px/1 var(--sans); color: var(--fg-dim); }
  .al-s { display: inline-flex; flex-wrap: wrap; }
  .aa { display: inline-block; width: 1.5em; text-align: center; border-radius: 4px; line-height: 1.55; }
  .al-row.parent .aa { color: var(--fg-dim); }
  .aa.chg { background: var(--hl); color: var(--fg); font-weight: 700; }
  .al-n { font: 12px/1.4 var(--sans); color: var(--fg-dim); padding-left: 96px; margin-top: 2px; }

  .axes { display: grid; gap: 12px; }
  .axis-h { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
  .axis-n { font-weight: 620; }
  .axis-v { margin-left: auto; font: 600 14px/1 var(--mono); }
  .chip { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px; line-height: 1.5; border: 1px solid var(--line); color: var(--fg-dim); white-space: nowrap; }
  .chip.solid { background: var(--hl); border-color: transparent; color: var(--fg); font-weight: 620; }
  .axis-r { margin: 6px 0 0; font-size: 12px; line-height: 1.45; color: var(--fg-dim); }
  .fp { margin-top: 8px; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 4px 14px; }
  .fp-cells { display: flex; gap: 10px; }
  .fp-g { display: grid; gap: 2px; }
  .fp-row { display: flex; gap: 2px; }
  .fp-c { width: 8px; height: 14px; border-radius: 2px; border: 1.5px solid var(--quiet); }
  .fp-c.on { background: var(--accent); border-color: var(--accent); }
  .fp-lab { font-size: 10.5px; color: var(--fg-dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .fp-n { font-size: 12px; color: var(--fg-dim); }

  .gates { display: flex; flex-wrap: wrap; gap: 6px; padding-top: 12px; border-top: 1px solid var(--line-soft); }
  .gate { font-size: 11.5px; padding: 2px 8px; border-radius: 6px; background: var(--track); color: var(--fg); }
  .gate.muted { background: transparent; border: 1px dashed var(--quiet); color: var(--fg-dim); }

  details.more summary { cursor: pointer; font-size: 12.5px; color: var(--fg-dim); padding: 2px 0; }
  details.more summary:hover { color: var(--fg); }
  details.more[open] summary { margin-bottom: 8px; }
  .more p { margin: 6px 0; font-size: 12.5px; line-height: 1.5; }
  .more .lbl { color: var(--fg-dim); display: block; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; font-weight: 650; margin-bottom: 1px; }
  .seqwrap { margin-top: 10px; }
  .seq-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 12px; color: var(--fg-dim); margin-bottom: 6px; }
  .seq { margin: 0; padding: 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; font: 11.5px/1.55 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; letter-spacing: .02em; }
  .seq mark { background: var(--hl); color: var(--fg); font-weight: 700; border-radius: 3px; }
  .seq .lk { color: var(--fg-dim); }
  .btn { font: inherit; font-size: 12px; padding: 3px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer; }
  .btn:hover { border-color: var(--accent-ink); }

  .tier { margin-top: 14px; padding: 16px 18px; }
  .tier h3 { margin-bottom: 10px; }
  .tbar { display: flex; gap: 2px; height: 28px; }
  .seg { min-width: 4px; border-radius: 4px; }
  .tlegend { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-top: 10px; font-size: 12.5px; }
  .tlegend span { display: inline-flex; align-items: center; gap: 7px; }
  .tlegend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .tlegend b { font-variant-numeric: tabular-nums; }

  /* ---- the swarm ---- */
  .chart { padding: 18px; margin-top: 16px; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .grid line { stroke: var(--grid); stroke-width: 1; }
  .axlab { fill: var(--fg-dim); font: 10.5px var(--sans); font-variant-numeric: tabular-nums; }
  .rowlab { fill: var(--fg); font: 650 12px var(--sans); }
  .rowsub { fill: var(--fg-dim); font: 11px var(--sans); }
  .refline { stroke: var(--fg-dim); stroke-width: 1.5; }
  .reflab { fill: var(--fg-dim); font: 600 10.5px var(--sans); }
  .dot-ok { fill: var(--quiet); }
  .dot-rej { fill: none; stroke: var(--quiet); stroke-width: 1.3; }
  .dot-sel { fill: var(--accent); stroke: var(--panel); stroke-width: 2; }
  .hitrow { fill: transparent; }
  .lens { fill: none; stroke: var(--fg); stroke-width: 1.5; }
  .clegend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 12px; font-size: 12px; color: var(--fg-dim); }
  .clegend span { display: inline-flex; align-items: center; gap: 7px; }
  .clegend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .clegend i.ok { background: var(--quiet); }
  .clegend i.rej { border: 1.3px solid var(--quiet); }
  .clegend i.sel { background: var(--accent); width: 12px; height: 12px; }

  /* ---- funnel ---- */
  .funnel { padding: 16px 18px; display: grid; gap: 16px; margin-top: 16px; }
  .fr { display: grid; grid-template-columns: 136px minmax(0, 1fr) 72px; gap: 6px 14px; align-items: center; }
  .fr-n b { display: block; font-size: 13px; }
  .fr-n span { display: block; font-size: 11px; color: var(--fg-dim); overflow-wrap: anywhere; }
  .fr-bar { display: flex; gap: 2px; height: 14px; }
  .fr-bar i { display: block; height: 100%; border-radius: 3px; }
  .fr-bar i.pass { background: var(--accent); }
  .fr-bar i.fail { background: var(--track); }
  .fr-f { text-align: right; font-size: 13px; font-variant-numeric: tabular-nums; }
  .fr-f b { font-weight: 650; }
  .fr-f span { color: var(--fg-dim); }
  .fr-cap { grid-column: 2 / -1; font-size: 12px; color: var(--fg-dim); }
  @media (max-width: 620px) {
    .fr { grid-template-columns: minmax(0, 1fr) 72px; }
    .fr-bar, .fr-cap { grid-column: 1 / -1; }
  }
  .callout { margin-top: 16px; padding: 12px 16px; border: 1px solid var(--line); border-left: 3px solid var(--warn); border-radius: 0 8px 8px 0; background: var(--panel); font-size: 13px; line-height: 1.5; }
  .callout b { color: var(--warn); }

  /* ---- leaderboard ---- */
  .tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin: 14px 0 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .fchip { font: inherit; font-size: 12.5px; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--fg-dim); cursor: pointer; }
  .fchip:hover { color: var(--fg); border-color: var(--quiet); }
  .fchip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); font-weight: 620; }
  .tkey { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; font-size: 12px; color: var(--fg-dim); }
  .tkey span { display: inline-flex; align-items: center; gap: 6px; }
  .tablewrap { overflow-x: auto; border-radius: 10px; }
  table { border-collapse: collapse; width: 100%; min-width: 900px; font-size: 13px; }
  th, td { padding: 7px 8px; border-bottom: 1px solid var(--line-soft); text-align: left; vertical-align: middle; }
  thead th { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--fg-dim); font-weight: 650; white-space: nowrap; background: var(--panel); border-bottom: 1px solid var(--line); }
  tbody tr:last-child td, tbody tr:last-child th { border-bottom: 0; }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
  th[scope="row"] { font-weight: 500; white-space: nowrap; }
  .c-id { position: sticky; left: 0; z-index: 1; background: var(--panel); }
  thead .c-id { z-index: 2; }
  .sort { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
  .sort:hover { color: var(--fg); }
  .sort:focus-visible { outline: 2px solid var(--accent-ink); outline-offset: 2px; border-radius: 3px; }
  th[aria-sort="ascending"] .sort::after { content: "\2191"; }
  th[aria-sort="descending"] .sort::after { content: "\2193"; }
  th[aria-sort] .sort { color: var(--fg); }
  .c-ax { white-space: nowrap; }
  .c-ax .v { display: inline-block; width: 44px; margin-left: 7px; font: 12.5px var(--mono); font-variant-numeric: tabular-nums; }
  .c-j { white-space: nowrap; }
  .c-j .v { display: inline-block; width: 46px; margin-left: 7px; font: 12.5px var(--mono); }
  .jb { position: relative; display: inline-block; vertical-align: middle; width: 88px; height: 10px; background: var(--track); border-radius: 5px; }
  .jb i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 0 4px 4px 0; background: var(--quiet); min-width: 3px; }
  .jb.sel i { background: var(--accent); }
  .jb.rej i { background: transparent; border: 1.5px solid var(--quiet); }
  .jb.ref i { background: var(--fg-dim); }
  .loop { font: 12.5px var(--mono); letter-spacing: .04em; }
  .loop .chg { background: var(--hl); color: var(--fg); font-weight: 700; border-radius: 3px; padding: 0 1px; }
  .loop small { font: 11.5px var(--sans); letter-spacing: 0; color: var(--fg-dim); margin-left: 6px; }
  tr.rej td, tr.rej th { color: var(--fg-dim); }
  tr.ref td, tr.ref th { background: var(--bg); color: var(--fg-dim); }
  tr.ref .c-id { background: var(--bg); }
  tr.hl td, tr.hl th { background: var(--hl); }
  tr.hl .c-id { background: var(--hl); }
  tr.flash td, tr.flash th { background: var(--hl); transition: background 1.2s; }
  .c-gate { font-size: 12.5px; white-space: nowrap; }
  /* The verdict mark rides the sticky first column, so it stays in view when the
     table scrolls sideways and the reason column is off to the right. */
  .vx { display: inline-block; width: 14px; margin-right: 6px; font-weight: 700; text-align: center; }
  .vx.no { color: var(--warn); }
  .tfoot { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 12px 2px 0; font-size: 12.5px; color: var(--fg-dim); }

  /* ---- what the scores rest on ---- */
  .ev-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; margin-top: 16px; }
  .ev { padding: 14px 16px; }
  .ev h3 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; margin-bottom: 6px; }
  .ev p { margin: 4px 0 0; font-size: 13px; line-height: 1.5; }
  .ev .dim { color: var(--fg-dim); font-size: 12.5px; }
  .ev ul { margin: 6px 0 0; padding-left: 18px; font-size: 13px; line-height: 1.5; }
  .ev li { margin: 4px 0; }
  .ev.flag { border-left: 3px solid var(--warn); }

  footer { margin-top: 48px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--fg-dim); display: grid; gap: 4px; }

  /* ---- tooltip: one element, filled from the hovered mark ---- */
  #tip { position: fixed; z-index: 50; left: 0; top: 0; max-width: 320px; padding: 10px 12px; background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); font-size: 12.5px; line-height: 1.45; pointer-events: none; opacity: 0; visibility: hidden; transition: opacity .08s; }
  #tip.on { opacity: 1; visibility: visible; }
  #tip .t-h { display: flex; justify-content: space-between; gap: 14px; align-items: baseline; }
  #tip .t-id { font: 600 12.5px var(--mono); overflow-wrap: anywhere; }
  #tip .t-st { font-size: 11.5px; color: var(--fg-dim); white-space: nowrap; }
  #tip .t-v { font-weight: 650; font-variant-numeric: tabular-nums; }
  #tip .t-d { color: var(--fg-dim); }
  #tip ul { margin: 6px 0 0; padding-left: 16px; color: var(--fg-dim); }

  noscript p { padding: 16px; margin: 0 0 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
  @media (max-width: 520px) { h1 { font-size: 27px; } .lede { font-size: 16px; } .al-l { width: 72px; } .al-n { padding-left: 82px; } }
</style>
</head>
<body>
<div class="wrap">
  <noscript><p>This page draws its charts with JavaScript. Every number is in the data block in the page source.</p></noscript>

  <header>
    <div class="eyebrow">FourWells · team-13</div>
    <h1>Current results</h1>
    <p class="lede" id="lede"></p>
    <p class="meta" id="meta"></p>
    <div class="stats" id="stats"></div>
  </header>

  <section aria-labelledby="h-picks">
    <div class="eyebrow">Shortlist</div>
    <h2 id="h-picks"></h2>
    <div class="scalekey" id="scalekey"></div>
    <div class="picks" id="picks"></div>
    <div class="card tier" id="tiers"></div>
  </section>

  <section aria-labelledby="h-swarm">
    <div class="eyebrow">The whole pool</div>
    <h2 id="h-swarm"></h2>
    <p class="note" id="swarm-note"></p>
    <div class="card chart"><div id="swarm"></div><div class="clegend" id="clegend"></div></div>
  </section>

  <section aria-labelledby="h-funnel">
    <div class="eyebrow">Entry gates</div>
    <h2 id="h-funnel"></h2>
    <div class="card funnel" id="funnel"></div>
    <p class="callout" id="strict"></p>
  </section>

  <section aria-labelledby="h-table">
    <div class="eyebrow">Every candidate</div>
    <h2 id="h-table"></h2>
    <div class="tools">
      <div class="chips" id="chips" role="group" aria-label="Filter candidates"></div>
      <div class="tkey" id="tkey"></div>
    </div>
    <div class="card tablewrap"><table id="tbl"></table></div>
    <div class="tfoot" id="tfoot"></div>
  </section>

  <section aria-labelledby="h-ev">
    <div class="eyebrow">Evidence</div>
    <h2 id="h-ev">What these scores rest on</h2>
    <div class="ev-grid" id="ev"></div>
  </section>

  <footer id="foot"></footer>

<script>
(() => {
'use strict';

const DATA = JSON.parse(document.getElementById('results-data').textContent);
const { meta, facts, designs } = DATA;
const AXES = ['binding', 'epitope', 'stability'];
const NAME = { binding: 'Binding', epitope: 'Epitope', stability: 'Stability' };
const GLYPH = { up: '▲', eq: '≈', down: '▼' };
const MODEL = { boltz2: 'Boltz-2', 'protenix-v2': 'Protenix v2' };
const TOOL = { aggrescan3d: 'Aggrescan3D', soluprot: 'SoluProt', netsolp: 'NetSolP', 'proteinmpnn-soluble': 'ProteinMPNN-soluble' };
const WORDS = ['no', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten'];
const rules = meta.rules, ref = meta.reference, base = meta.baseline;
const byId = new Map(designs.map(d => [d.id, d]));
const picks = designs.filter(d => d.selected).sort((a, b) => a.rank - b.rank);
const n = picks.length;
const JOINT_MAX = (ref && ref.joint) || Math.max(...designs.map(d => d.joint || 0));

// ---- helpers ------------------------------------------------------------------------
const $ = (sel, r = document) => r.querySelector(sel);
const word = k => (WORDS[k] !== undefined ? WORDS[k] : String(k));
const cap = str => str.charAt(0).toUpperCase() + str.slice(1);
const f2 = v => (v == null ? '—' : v.toFixed(2));
const fj = v => (v == null ? '—' : v >= 0.01 ? v.toFixed(3) : v.toFixed(4));
const list = a => (a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1]);
const range = (a, b) => Array.from({ length: b - a + 1 }, (_, i) => a + i);
const span = (lo, hi) => (lo === hi ? String(lo) : lo + '–' + hi);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

// Element builders. Every string goes through createTextNode, never innerHTML.
const SVGNS = 'http://www.w3.org/2000/svg';
function apply(el, attrs) {
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'style') el.style.cssText = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
}
function add(el, kids) {
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
}
function h(tag, attrs, ...kids) { const el = document.createElement(tag); apply(el, attrs); add(el, kids); return el; }
function s(tag, attrs, ...kids) { const el = document.createElementNS(SVGNS, tag); apply(el, attrs); add(el, kids); return el; }
const mount = (sel, ...kids) => { const el = $(sel); el.replaceChildren(...kids.flat(Infinity).filter(Boolean)); return el; };

// "all four fall short" / "three beat it and one ties it", from the report's own ▲ ≈ ▼ rule
function verdict(c, total) {
  const up = c.up || 0, eq = c.eq || 0, down = c.down || 0;
  if (down === total) return `all ${word(total)} fall short`;
  if (up === total) return `all ${word(total)} beat it`;
  if (eq === total) return `all ${word(total)} tie it`;
  const parts = [];
  if (up) parts.push(`${word(up)} beat it`);
  if (eq) parts.push(`${word(eq)} tie it`);
  if (down) parts.push(`${word(down)} fall short`);
  return list(parts);
}
const pickClauses = () => {
  const groups = new Map();
  for (const a of AXES) {
    const v = verdict((facts.trends.picks || {})[a] || {}, n);
    if (!groups.has(v)) groups.set(v, []);
    groups.get(v).push(a);
  }
  return [...groups].map(([v, axes]) => `on ${list(axes)} ${v}`);
};

// ---- header -------------------------------------------------------------------------
function renderHeader() {
  const pa = facts.per_axis, N = facts.n_candidates;
  const none = AXES.filter(a => pa[a].above === 0), some = AXES.filter(a => pa[a].above > 0);
  mount('#lede',
    `${facts.n_eligible} of ${N} candidates clear every entry gate, and ${word(n)} of those take the ${word(n)} lab slots. `,
    none.length
      ? `Across the whole pool nothing is predicted to beat trastuzumab on ${list(none)}` +
        (some.length ? `, while ${list(some.map(a => `${pa[a].above} beat it on ${a}`))}. ` : '. ')
      : `${list(AXES.map(a => `${pa[a].above} of ${N} beat trastuzumab on ${a}`))}. `,
    facts.multi_axis.two_or_more === 0
      ? `Nothing beats it on more than one axis, so the honest expectation from the ${word(n)} wells is ${facts.joint_sum.toFixed(2)} S-tier designs: a ${Math.round(facts.p_any_s * 100)}% chance that at least one lands.`
      : `${facts.multi_axis.two_or_more} beat it on two axes or more, and the expectation from the ${word(n)} wells is ${facts.joint_sum.toFixed(2)} S-tier designs.`);
  mount('#meta',
    'Source ', h('code', {}, meta.source), ` · ${meta.n_records} records · sha256 ${meta.sha256}`,
    meta.run_at ? ` · run ${meta.run_at}` : '');
  const tile = (k, v, note) => h('div', { class: 'card stat' }, h('div', { class: 'k' }, k), h('b', {}, v), h('div', { class: 's' }, note));
  mount('#stats',
    tile('Candidates', facts.n_candidates, `${facts.batches.length} generator batches · ${facts.n_clusters} clusters`),
    tile('Clear every gate', facts.n_eligible, `${facts.n_candidates - facts.n_eligible} rejected`),
    tile('Chosen', n, facts.clusters_distinct ? 'one per cluster' : 'by the portfolio rule'),
    tile('Expected S-tier', facts.joint_sum.toFixed(2), `of ${word(n)} · the joint scores summed`));
}

// ---- the four -----------------------------------------------------------------------
function diverging(v, small) {
  const lo = Math.min(v, base), hi = Math.max(v, base);
  return h('div', { class: 'dv' + (small ? ' sm' : ''), role: 'img', 'aria-label': `${f2(v)} against a baseline of ${f2(base)}` },
    v == null ? null : h('i', { class: v >= base ? 'pos' : 'neg', style: `left:${lo * 100}%;width:${(hi - lo) * 100}%` }));
}
const basisChip = b => h('span',
  { class: 'chip' + (b === 'structural' ? ' solid' : ''),
    title: b === 'structural' ? 'Measured from the refolded complex' : b === 'prior' ? 'Hand-set weights, not fitted to measurements' : b },
  b || 'none');

function alignment(d) {
  const r = ref.cdrh3, q = d.cdrh3, same = r.length === q.length;
  const row = (label, seq, cls, mark) => h('div', { class: 'al-row ' + cls },
    h('span', { class: 'al-l' }, label),
    h('span', { class: 'al-s' }, [...seq].map((c, i) => h('span', { class: 'aa' + (same && mark && c !== r[i] ? ' chg' : '') }, c))));
  return h('div', { class: 'align', role: 'img', 'aria-label': `CDRH3 ${q}, ${d.subs} of ${q.length} positions changed from ${r}` },
    row('trastuzumab', r, 'parent', false),
    row('this design', q, 'design', true),
    h('div', { class: 'al-n' }, same ? `CDRH3 · ${d.subs} of ${q.length} positions changed` : `CDRH3 · loop length ${q.length} against ${r.length}, so no position-by-position alignment`));
}

function footprint(ep) {
  const hit = new Set(ep.hit);
  const groups = meta.epitope.spans.map(([lo, hi]) => h('div', { class: 'fp-g' },
    h('div', { class: 'fp-row' }, range(lo, hi).map(k => h('i', { class: 'fp-c' + (hit.has(k) ? ' on' : ''), title: `HER2 ${k}: ${hit.has(k) ? 'contacted' : 'not contacted'}` }))),
    h('div', { class: 'fp-lab' }, span(lo, hi))));
  return h('div', { class: 'fp' },
    h('div', { class: 'fp-cells', role: 'img', 'aria-label': `${ep.hit.length} of ${meta.epitope.n} annotated epitope residues contacted` }, groups),
    h('span', { class: 'fp-n' }, `${ep.hit.length} of ${meta.epitope.n} epitope residues within ${ep.cutoff} Å in the ${MODEL[ep.model] || ep.model} refold`));
}

function gateChips(d) {
  const chips = [];
  const ok = (good, text) => h('span', { class: 'gate' }, (good ? '✓ ' : '✕ ') + text);
  if (d.length != null) chips.push(ok(d.length <= rules.max_length, `${d.length} aa ≤ ${rules.max_length}`));
  if (d.identity != null) chips.push(ok(d.identity < rules.max_identity, `CDRH3 identity ${d.identity.toFixed(2)} < ${rules.max_identity.toFixed(2)}`));
  if (d.dist != null) chips.push(ok(d.dist >= rules.min_distance, d.dist_capped ? `≥ ${d.dist} substitutions from every provided sequence` : `${d.dist} substitutions from the nearest provided sequence`));
  if (d.abguard) chips.push(h('span', { class: 'gate' + (d.abguard === 'NOT RUN' ? ' muted' : '') }, d.abguard === 'NOT RUN' ? 'abguard not run' : 'abguard ' + d.abguard));
  return h('div', { class: 'gates' }, chips);
}

function seqBlock(d) {
  const c = d.dossier && d.dossier.construct;
  if (!c) return null;
  const full = c.seq || c.vh + c.linker + c.vl;
  const pre = h('pre', { class: 'seq', tabindex: '0' });
  if (c.vh) {
    const i = c.vh.indexOf(d.cdrh3);
    if (i >= 0) pre.append(c.vh.slice(0, i), h('mark', {}, d.cdrh3), c.vh.slice(i + d.cdrh3.length));
    else pre.append(c.vh);
    pre.append(h('span', { class: 'lk' }, c.linker), c.vl);
  } else pre.append(full);
  const btn = h('button', { type: 'button', class: 'btn' }, 'Copy sequence');
  btn.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(full); btn.textContent = 'Copied'; }
    catch (e) { getSelection().selectAllChildren(pre); btn.textContent = 'Selected, press copy'; }
    setTimeout(() => { btn.textContent = 'Copy sequence'; }, 1600);
  });
  return h('div', { class: 'seqwrap' },
    h('div', { class: 'seq-h' }, h('span', {}, `Construct as ordered · ${full.length} aa${d.dossier.orientation ? ' · ' + d.dossier.orientation : ''}`), btn), pre);
}

function pickCard(d) {
  const dos = d.dossier || {};
  const axes = AXES.map(a => h('div', { class: 'axis' },
    h('div', { class: 'axis-h' }, h('span', { class: 'axis-n' }, NAME[a]), basisChip(d.basis[a]), h('span', { class: 'axis-v' }, f2(d.axes[a]) + ' ' + (GLYPH[d.trend[a]] || ''))),
    diverging(d.axes[a]),
    // Where a footprint is drawn it already states the overlap exactly ("15 of 20"),
    // so the scorer's own sentence for this axis would only repeat it as a percentage.
    a === 'epitope' && d.epitope ? footprint(d.epitope) : h('p', { class: 'axis-r' }, d.reason[a] || '')));
  return h('article', { class: 'card pick', 'data-id': d.id },
    h('header', { class: 'pick-h' },
      h('span', { class: 'rank', 'aria-label': 'Rank ' + d.rank }, d.rank),
      h('div', { class: 'pick-t' }, h('h3', {}, d.id), h('p', { class: 'sub' }, [d.track, d.format, dos.construct_length ? dos.construct_length + ' aa' : null, d.generator].filter(Boolean).join(' · '))),
      h('div', { class: 'pick-j' }, h('b', {}, fj(d.joint)), h('span', {}, 'joint P(S-tier)'))),
    alignment(d),
    h('div', { class: 'axes' }, axes),
    gateChips(d),
    h('details', { class: 'more' },
      h('summary', {}, 'Why this one, kill criterion, sequence'),
      dos.cluster_note ? h('p', {}, h('span', { class: 'lbl' }, 'Cluster'), dos.cluster_note) : null,
      dos.why_listed ? h('p', {}, h('span', { class: 'lbl' }, 'On the list'), dos.why_listed) : null,
      dos.kill ? h('p', {}, h('span', { class: 'lbl' }, 'Kill criterion'), dos.kill) : null,
      seqBlock(d)));
}

function renderPicks() {
  mount('#h-picks', `${cap(word(n))} designs go to the lab, and ${pickClauses().join('; ')}`);
  mount('#scalekey',
    h('div', { class: 'dv' }, h('i', { class: 'neg', style: 'left:22%;width:28%' }), h('i', { class: 'pos', style: 'left:50%;width:22%' })),
    h('span', {}, `Every bar starts at ${f2(base)}, which is trastuzumab. Teal runs right where a design is predicted to beat it, amber runs left where it falls short. Scale 0 to 1.`));
  mount('#picks', picks.map(pickCard));
  const t = facts.tiers, total = t.S + t.A + t.B + t.none;
  const parts = [['S-tier', 'beats trastuzumab on all three axes', t.S, 'var(--tier-s)'], ['A-tier', 'on two', t.A, 'var(--tier-a)'], ['B-tier', 'on one', t.B, 'var(--tier-b)'], ['No tier', 'on none', t.none, 'var(--tier-none)']];
  mount('#tiers',
    h('h3', {}, `What the ${word(n)} wells are expected to return`),
    h('div', { class: 'tbar', role: 'img', 'aria-label': parts.map(p => `${p[0]} ${p[2].toFixed(2)}`).join(', ') + ` of ${n} designs` },
      parts.filter(p => p[2] > 0).map(p => h('div', { class: 'seg', style: `flex:${p[2] / total} 1 0%;background:${p[3]}`, tabindex: '0', 'data-tip': `${p[0]}: ${p[2].toFixed(2)} of ${n} designs expected, ${p[1]}` }))),
    h('div', { class: 'tlegend' }, parts.map(p => h('span', {}, h('i', { style: `background:${p[3]}` }), p[0] + ' ', h('b', {}, p[2].toFixed(2))))),
    h('p', { class: 'note' }, `Expected number of the ${word(n)} designs landing at each tier, taking the three axis scores as independent probabilities exactly as the joint score does. They are hand-set priors rather than fitted probabilities, so read this as a ranking aid and not a forecast.`));
}

// ---- the swarm: every candidate on one log axis, grouped by batch --------------------
// Each dot is nudged off its row's centre line until it clears its neighbours, so
// density shows without binning the values into a histogram.
function layout(points, r, gap) {
  const placed = [];
  for (const p of points) {
    const near = placed.filter(q => Math.abs(q.x - p.x) < q.r + p.r + gap);
    let off = 0;
    for (let k = 0; k < 600; k++) {
      const cands = k === 0 ? [0] : [k, -k];
      let found = null;
      for (const c of cands) {
        if (near.every(q => Math.hypot(q.x - p.x, q.y - c) >= q.r + p.r + gap)) { found = c; break; }
      }
      if (found !== null) { off = found; break; }
    }
    p.y = off;
    placed.push(p);
  }
}

const swarmState = { width: 0 };
function renderSwarm() {
  const host = $('#swarm');
  const W = Math.max(280, Math.round(host.clientWidth || 640));
  if (W === swarmState.width) return;
  swarmState.width = W;

  const vals = designs.map(d => d.joint).filter(v => v > 0);
  const hi = Math.max(...vals, ref ? ref.joint : 0) * 1.3;
  const lo = Math.min(...vals) * 0.8;
  const L = Math.log10(lo), H = Math.log10(hi);
  const x = v => ((Math.log10(Math.max(v, lo)) - L) / (H - L)) * W;

  const r = W < 520 ? 2.6 : 3.2, TOP = 24, BOT = 16;
  const rows = [];
  let y = 0;
  for (const b of facts.batches) {
    const pts = designs.filter(d => d.batch === b.batch)
      .map(d => ({ x: x(d.joint), r: d.selected ? 6 : r, d }))
      .sort((p, q) => (q.d.selected - p.d.selected) || (p.x - q.x));
    layout(pts, r, 1);
    const extent = Math.max(9, ...pts.map(p => Math.abs(p.y) + p.r));
    rows.push({ b, pts, top: y, mid: y + TOP + extent, height: TOP + extent * 2 + BOT });
    y += TOP + extent * 2 + BOT;
  }
  const total = y + 32;

  const ticks = [];
  for (let e = -5; e <= 0; e++) {
    const v = Math.pow(10, e);
    if (v >= lo && v <= hi) ticks.push(v);
  }

  const svg = s('svg', { viewBox: `0 0 ${W} ${total}`, role: 'img',
    'aria-label': `Joint P(S-tier) for all ${facts.n_candidates} candidates on a logarithmic axis, grouped into ${facts.batches.length} generator batches, with the ${n} chosen designs marked. Every value is in the table below.` });
  svg.append(s('g', { class: 'grid' }, ticks.map(t => s('line', { x1: x(t), x2: x(t), y1: 0, y2: y }))));

  for (const row of rows) {
    svg.append(s('text', { class: 'rowlab', x: 0, y: row.top + 13 }, row.b.batch));
    svg.append(s('text', { class: 'rowsub', x: row.b.batch.length * 7.4 + 10, y: row.top + 13 },
      `${row.b.n} designs · ${row.b.eligible} eligible${row.b.chosen ? ` · ${row.b.chosen} chosen` : ''}`));
    const g = s('g', { 'data-batch': row.b.batch, transform: `translate(0,${row.mid})` });
    g.append(s('rect', { class: 'hitrow', x: 0, y: -(row.height / 2), width: W, height: row.height }));
    for (const p of row.pts) {
      const dot = s('circle', {
        class: p.d.selected ? 'dot-sel' : p.d.passed ? 'dot-ok' : 'dot-rej',
        cx: p.x.toFixed(1), cy: p.y, r: p.r, 'data-id': p.d.id,
      });
      if (p.d.selected) {
        apply(dot, { tabindex: '0', role: 'img', 'aria-label': `Chosen, rank ${p.d.rank}: ${p.d.id}, joint ${fj(p.d.joint)}` });
      }
      g.append(dot);
    }
    svg.append(g);
  }

  if (ref) {
    svg.append(s('line', { class: 'refline', x1: x(ref.joint), x2: x(ref.joint), y1: 0, y2: y }));
    svg.append(s('text', { class: 'reflab', x: x(ref.joint) - 6, y: 11, 'text-anchor': 'end' }, `trastuzumab ${fj(ref.joint)}`));
  }
  svg.append(s('g', {}, ticks.map(t => s('text', { class: 'axlab', x: x(t), y: y + 16, 'text-anchor': 'middle' }, String(t)))));
  svg.append(s('text', { class: 'axlab', x: 0, y: y + 30 }, 'joint P(S-tier), logarithmic'));

  host.replaceChildren(svg);
  mount('#clegend',
    h('span', {}, h('i', { class: 'sel' }), `chosen (${n})`),
    h('span', {}, h('i', { class: 'ok' }), `clears every gate (${facts.n_eligible})`),
    h('span', {}, h('i', { class: 'rej' }), `rejected at a gate (${facts.n_candidates - facts.n_eligible})`),
    h('span', {}, 'Hover anywhere in a row for the nearest design.'));
}

function renderSwarmText() {
  const k = facts.above_best_eligible, po = facts.passed_over;
  mount('#h-swarm', k > 0
    ? `The ${k} highest-scoring designs in the pool are all rejected at a gate`
    : `The highest-scoring design in the pool also clears every gate`);
  mount('#swarm-note',
    k > 0 ? `Rank on joint score alone and the top ${k} of ${facts.n_candidates} cannot be submitted: each sits too close to a provided sequence, or its construct runs over ${rules.max_length} aa. The best submittable design is ${k + 1}th on that raw list. ` : '',
    po.length === 1
      ? `One eligible design outscores the lowest pick and still gets no well: ${po[0].id} shares cluster ${po[0].cluster} with ${po[0].represented_by}, so its hypothesis is already being tested.`
      : po.length > 1
        ? `${cap(word(po.length))} eligible designs outscore the lowest pick and still get no well, each sharing a cluster with a design already chosen.`
        : `The ${word(n)} picks are the ${word(n)} highest-scoring eligible designs.`);
}

// ---- what the gates cost ------------------------------------------------------------
const REASON = {
  length: rs => `${rs.n} over ${rules.max_length} aa` + (rs.min != null ? ` (${span(rs.min, rs.max)} aa)` : ''),
  novelty: rs => `${rs.n} too close to a provided sequence` + (rs.min != null ? ` (${span(rs.min, rs.max)} substitutions away, the rule needs ${rules.min_distance})` : ''),
  identity: rs => `${rs.n} at or above ${rules.max_identity.toFixed(2)} CDRH3 identity`,
  cysteine: rs => `${rs.n} with an unpaired cysteine`,
  other: rs => `${rs.n} at another gate`,
};
function renderFunnel() {
  const bs = [...facts.batches].sort((a, b) => b.eligible - a.eligible);
  mount('#h-funnel', 'What each generator batch cost at the gates');
  mount('#funnel',
    bs.map(b => {
      const fail = b.n - b.eligible;
      const reasons = b.reasons.map(rs => (REASON[rs.kind] || REASON.other)(rs));
      return h('div', { class: 'fr' },
        h('div', { class: 'fr-n' }, h('b', {}, b.batch), h('span', {}, String(b.generator).replace(/^rfd4-proteina:/, ''))),
        h('div', { class: 'fr-bar', role: 'img', 'aria-label': `${b.eligible} of ${b.n} clear every gate` },
          b.eligible ? h('i', { class: 'pass', style: `width:${(b.eligible / b.n) * 100}%` }) : null,
          fail ? h('i', { class: 'fail', style: `width:${(fail / b.n) * 100}%` }) : null),
        h('div', { class: 'fr-f' }, h('b', {}, b.eligible), h('span', {}, ' / ' + b.n)),
        reasons.length ? h('div', { class: 'fr-cap' }, 'Rejected: ' + list(reasons) + '.') : null);
    }),
    h('p', { class: 'note', style: 'margin:0' },
      `Teal is the share of each batch that clears every gate. The gates re-implement the brief locally: construct up to ${rules.max_length} aa, CDRH3 identity under ${rules.max_identity.toFixed(2)}, no unpaired cysteine, and at least ${rules.min_distance} substitutions from any of the provided sequences. Each rejected design is counted once, under the first rule it failed.`));

  const a = facts.audit;
  mount('#strict',
    h('b', {}, `${a.priced_out_by_strict_reading} designs turn on how one rule is read. `),
    `They sit at exactly ${a.submittable_distance - 1} substitutions from the nearest provided sequence and fail nothing else. The challenge says more than ${a.submittable_distance - 1} point mutations from any provided antibody; this run takes the strict reading and requires ${a.submittable_distance}, which is what rejects them. The lenient reading would admit all ${a.priced_out_by_strict_reading}.`);
}

// ---- leaderboard --------------------------------------------------------------------
const state = { filter: 'all', key: 'joint', dir: -1, limit: 25 };
const FILTERS = [
  ['all', 'All', () => true],
  ['eligible', 'Eligible', d => d.passed],
  ['chosen', 'Chosen', d => d.selected],
  ['rejected', 'Rejected', d => !d.passed],
];
const COLS = [
  { key: 'id', label: 'Design', cls: 'c-id' },
  { key: null, label: 'CDRH3' },
  { key: 'subs', label: 'Subs', cls: 'n' },
  { key: 'binding', label: 'Binding' },
  { key: 'epitope', label: 'Epitope' },
  { key: 'stability', label: 'Stability' },
  { key: 'joint', label: 'Joint P(S-tier)' },
  { key: null, label: 'Entry gates' },
];
const sortValue = (d, k) => (AXES.includes(k) ? d.axes[k] : d[k]);

function loopCell(d) {
  const r = ref.cdrh3, same = r.length === d.cdrh3.length, delta = d.cdrh3.length - r.length;
  return h('span', { class: 'loop' }, [...d.cdrh3].map((c, i) => (same && c !== r[i] ? h('span', { class: 'chg' }, c) : c)),
    same ? null : h('small', {}, `${delta > 0 ? '+' : ''}${delta} aa`));
}
const axisCell = (d, a) => h('td', { class: 'c-ax' }, diverging(d.axes[a], true), h('span', { class: 'v' }, f2(d.axes[a]) + ' ' + (GLYPH[d.trend[a]] || '')));
const jointCell = (v, cls) => h('td', { class: 'c-j' }, h('span', { class: 'jb ' + cls }, h('i', { style: `width:${Math.min(1, (v || 0) / JOINT_MAX) * 100}%` })), h('span', { class: 'v' }, fj(v)));

// The long rule text wraps and makes every row taller, so the column gets a compact
// form built from the same fields the rule was applied to. The sentence the gate
// itself wrote stays in the tooltip.
function failWords(d) {
  return d.fails.map(f => {
    if (f.kind === 'length' && d.length != null) return `${d.length} aa over ${rules.max_length}`;
    // The threshold is stated once above the table rather than on all 195 rows.
    if (f.kind === 'novelty') return d.dist == null ? 'too close to a provided sequence' : `${d.dist} from a provided sequence`;
    if (f.kind === 'identity' && d.identity != null) return `identity ${d.identity.toFixed(2)} ≥ ${rules.max_identity.toFixed(2)}`;
    if (f.kind === 'cysteine') return 'unpaired cysteine';
    return f.text;
  });
}
// A dozen designs fail two rules. Listing both doubles the column's width for every
// row, so the cell carries the first and counts the rest; the tooltip has them all.
function failShort(d) {
  const w = failWords(d);
  return w.length > 1 ? `${w[0]} +${w.length - 1}` : w.join('');
}
function rowFor(d) {
  return h('tr', { class: d.selected ? 'sel' : d.passed ? '' : 'rej', 'data-id': d.id },
    h('th', { scope: 'row', class: 'c-id' },
      h('span', { class: 'vx' + (d.passed ? '' : ' no'), title: d.passed ? 'Clears every gate' : failShort(d) }, d.passed ? '✓' : '✕'),
      d.selected ? h('span', { class: 'rank sm' }, d.rank) : null,
      h('span', { class: 'mono' }, d.id)),
    h('td', {}, loopCell(d)),
    h('td', { class: 'n' }, d.subs == null ? '—' : d.subs),
    AXES.map(a => axisCell(d, a)),
    jointCell(d.joint, d.selected ? 'sel' : d.passed ? '' : 'rej'),
    // No tick or cross here: the sticky first column already carries the verdict,
    // and repeating it only pushes the reason out of view.
    h('td', { class: 'c-gate', title: d.passed ? null : failWords(d).join(' · ') },
      d.passed ? 'clears every gate' : failShort(d)));
}
function renderTable() {
  const f = FILTERS.find(x => x[0] === state.filter)[2];
  const all = designs.filter(f).sort((a, b) => {
    const xv = sortValue(a, state.key), yv = sortValue(b, state.key);
    if (typeof xv === 'string' || typeof yv === 'string') return state.dir * String(xv).localeCompare(String(yv));
    return state.dir * ((xv == null ? -1 : xv) - (yv == null ? -1 : yv)) || a.id.localeCompare(b.id);
  });
  const shown = state.limit ? all.slice(0, state.limit) : all;
  const head = h('thead', {}, h('tr', {}, COLS.map(c => h('th', { class: c.cls || '', scope: 'col', 'aria-sort': c.key && state.key === c.key ? (state.dir > 0 ? 'ascending' : 'descending') : null },
    c.key ? h('button', { type: 'button', class: 'sort', onclick: () => { state.dir = state.key === c.key ? -state.dir : (c.key === 'id' ? 1 : -1); state.key = c.key; renderTable(); } }, c.label) : c.label))));
  const refRow = ref ? h('tr', { class: 'ref' },
    h('th', { scope: 'row', class: 'c-id' }, h('span', { class: 'mono' }, ref.id), h('span', { class: 'chip', style: 'margin-left:8px' }, 'reference')),
    h('td', {}, h('span', { class: 'loop' }, ref.cdrh3)),
    h('td', { class: 'n' }, 0),
    AXES.map(a => h('td', { class: 'c-ax' }, diverging(ref.axes[a], true), h('span', { class: 'v' }, f2(ref.axes[a])))),
    jointCell(ref.joint, 'ref'),
    h('td', { class: 'c-gate' }, 'the baseline itself')) : null;
  mount('#tbl', head, h('tbody', {}, refRow, shown.map(rowFor)));
  document.querySelectorAll('.fchip').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.f === state.filter)));
  const more = all.length - shown.length;
  mount('#tfoot',
    h('span', {}, `Showing ${shown.length} of ${all.length}${state.filter === 'all' ? '' : ' ' + state.filter} designs, plus the reference row.`),
    more > 0
      ? h('button', { type: 'button', class: 'btn', onclick: () => { state.limit = 0; renderTable(); } }, `Show all ${all.length}`)
      : all.length > 25
        ? h('button', { type: 'button', class: 'btn', onclick: () => { state.limit = 25; renderTable(); } }, 'Show first 25')
        : null);
}
function renderTableChrome() {
  mount('#h-table', 'Every candidate, with the gate verdict beside it');
  mount('#chips', FILTERS.map(([key, label, fn]) => h('button', { type: 'button', class: 'fchip', 'data-f': key, 'aria-pressed': 'false', onclick: () => { state.filter = key; renderTable(); } }, `${label} ${designs.filter(fn).length}`)));
  mount('#tkey',
    h('span', {}, h('i', { class: 'jb sel', style: 'width:26px;height:8px' }, h('i', { style: 'width:100%' })), 'chosen'),
    h('span', {}, h('i', { class: 'jb', style: 'width:26px;height:8px' }, h('i', { style: 'width:100%' })), 'eligible'),
    h('span', {}, h('i', { class: 'jb rej', style: 'width:26px;height:8px' }, h('i', { style: 'width:100%' })), 'rejected'),
    h('span', {}, `Joint bar scale 0 to ${fj(JOINT_MAX)}, which is trastuzumab. Axis bars start at ${f2(base)}. A design needs ${rules.min_distance} substitutions from every provided sequence and at most ${rules.max_length} aa.`));
}

// ---- what the scores rest on ---------------------------------------------------------
const counts = o => Object.entries(o || {}).map(([k, v]) => `${v} ${k}`).join(', ');
function renderEvidence() {
  const B = facts.basis, E = facts.evidence, ep = meta.epitope, a = facts.audit;
  const folded = facts.batches.filter(b => b.folded > 0 && b.median_overlap != null);
  const TEXT = {
    binding: { prior: 'Hand-set weights over CDRH3 features: substitutions from the parent loop, paratope-residue content, aromatics and volume change. Not fitted to the measured affinities.' },
    epitope: {
      prior: 'No refolded complex on record, so scored from how much of trastuzumab’s CDR paratope the design keeps.',
      structural: `Share of the ${ep.n} scorable HER2 epitope residues sitting within ${ep.cutoff} Å of the binder in the ${MODEL[ep.model] || ep.model} refold.`,
    },
    stability: { prior: 'Hand-set weights over framework substitutions, pI distance, loop composition and hydrophobic-patch burden.' },
  };
  const items = AXES.map(ax => {
    const keys = Object.keys(B[ax].pool);
    return h('div', { class: 'card ev' },
      h('h3', {}, NAME[ax], keys.map(k => basisChip(k))),
      keys.map(k => h('p', {}, h('b', {}, k + ': '), TEXT[ax][k] || 'See the record.')),
      h('p', { class: 'dim' }, `Candidates: ${counts(B[ax].pool)}. Chosen: ${counts(B[ax].picks)}.`),
      ax === 'epitope' && folded.length
        ? h('p', { class: 'dim' }, 'Median overlap where a fold exists — ' + list(folded.map(b => `${b.batch} ${b.median_overlap.toFixed(2)} on ${b.folded} folds`)) + '.')
        : null);
  });
  const conf = E.confidence;
  items.push(h('div', { class: 'card ev' }, h('h3', {}, 'Structure confidence'),
    h('p', {}, conf.calibrated
      ? 'ipTM and pLDDT feed the binding score through a calibrated cutoff.'
      : 'ipTM and pLDDT add nothing to any score here. The cutoff is not calibrated against the measured non-binders, so a high value is ignored rather than trusted.'),
    conf.policy ? h('p', { class: 'dim' }, `Policy: ${conf.policy}.`) : null));
  if ((E.stability_tools_missing || []).length) {
    items.push(h('div', { class: 'card ev' }, h('h3', {}, 'Developability screens'),
      h('p', {}, `Not run: ${list(E.stability_tools_missing.map(t => TOOL[t] || t))}.`),
      h('p', { class: 'dim' }, 'The stability score carries no solubility or aggregation prediction.')));
  }
  if ((a.blockers || []).length) {
    items.push(h('div', { class: 'card ev flag' }, h('h3', {}, 'Before submitting'),
      h('p', {}, 'The pipeline does not call this shortlist submission-ready. Its own blockers:'),
      h('ul', {}, a.blockers.map(b => h('li', {}, b))),
      h('p', { class: 'dim' }, `Each pick's measured distance to the provided set was re-checked: ${a.novelty_distance_verified ? 'all clear' : 'not verified'}. Tracks: ${counts(a.tracks)}.`)));
  }
  mount('#ev', items);
}

function renderFooter() {
  mount('#foot',
    h('span', {}, 'This page recomputes nothing. Every number comes from ', h('code', {}, meta.source), `, ${meta.n_records} records, sha256 ${meta.sha256}.`),
    h('span', {}, 'Each axis is P(beats trastuzumab), so 0.50 is a tie by construction. Regenerate with ', h('code', {}, 'python3 -I viz/build_results.py'), '.'));
}

// ---- tooltip, nearest-dot lookup, cross-highlighting ---------------------------------
const tip = $('#tip');
function designTip(d) {
  return h('div', {},
    h('div', { class: 't-h' }, h('span', { class: 't-id' }, d.id), h('span', { class: 't-st' }, d.selected ? `Chosen, rank ${d.rank}` : d.passed ? 'Eligible' : 'Rejected')),
    h('div', { class: 't-d' }, `${d.batch} · CDRH3 ${d.cdrh3} · ${d.subs == null ? '—' : d.subs} substitutions`),
    h('div', {}, AXES.map((a, i) => [h('span', { class: 't-d' }, a + ' '), h('span', { class: 't-v' }, f2(d.axes[a]) + (GLYPH[d.trend[a]] ? ' ' + GLYPH[d.trend[a]] : '')), i < AXES.length - 1 ? '  ' : '']).flat()),
    h('div', {}, h('span', { class: 't-d' }, 'joint '), h('span', { class: 't-v' }, fj(d.joint))),
    d.fails.length ? h('ul', {}, d.fails.map(f => h('li', {}, f.text))) : null);
}
function place(x, y) {
  const t = tip.getBoundingClientRect();
  let px = x - t.width / 2, py = y - t.height - 14;
  if (py < 8) py = y + 20;
  px = Math.max(8, Math.min(px, innerWidth - t.width - 8));
  tip.style.transform = `translate(${Math.round(px)}px,${Math.round(py)}px)`;
}
function showTip(content, x, y) { if (!content) return; tip.replaceChildren(content); tip.classList.add('on'); place(x, y); }
const hideTip = () => { tip.classList.remove('on'); clearLens(); };
let lit = [];
function highlight(id) {
  lit.forEach(e => e.classList.remove('hl'));
  lit = id ? [...document.querySelectorAll('tbody tr[data-id]')].filter(e => e.dataset.id === id) : [];
  lit.forEach(e => e.classList.add('hl'));
}
let lens = null;
function clearLens() { if (lens) { lens.remove(); lens = null; } }
function markLens(dot) {
  clearLens();
  lens = s('circle', { class: 'lens', cx: dot.getAttribute('cx'), cy: dot.getAttribute('cy'), r: Number(dot.getAttribute('r')) + 3.5 });
  dot.parentNode.append(lens);
}
// Nearest dot in the hovered row, so the pointer only has to be close to one.
function nearestDot(row, evt) {
  const svg = row.ownerSVGElement;
  if (!svg) return null;
  const box = svg.getBoundingClientRect();
  const scale = box.width / svg.viewBox.baseVal.width;
  const px = (evt.clientX - box.left) / scale;
  const m = row.transform.baseVal.consolidate();
  const py = (evt.clientY - box.top) / scale - (m ? m.matrix.f : 0);
  let best = null, bd = Infinity;
  for (const dot of row.querySelectorAll('circle[data-id]')) {
    const d = Math.hypot(px - Number(dot.getAttribute('cx')), py - Number(dot.getAttribute('cy')));
    if (d < bd) { bd = d; best = dot; }
  }
  return bd * scale < 56 ? best : null;
}
function wire() {
  const hoverable = e => e.target.closest('.seg[data-tip], tbody tr[data-id]');
  document.addEventListener('pointerover', e => {
    const el = hoverable(e);
    if (!el) return;
    const r = el.getBoundingClientRect();
    if (el.dataset.id) {
      const d = byId.get(el.dataset.id);
      highlight(el.dataset.id);
      if (d) showTip(designTip(d), r.left + Math.min(220, r.width / 2), r.top);
    } else showTip(h('div', {}, el.dataset.tip), r.left + r.width / 2, r.top);
  });
  document.addEventListener('pointerout', e => {
    const el = hoverable(e);
    if (el && !el.contains(e.relatedTarget)) { highlight(null); hideTip(); }
  });
  document.addEventListener('focusin', e => {
    const dot = e.target.closest('circle[data-id]');
    if (dot) {
      const r = dot.getBoundingClientRect();
      markLens(dot);
      highlight(dot.dataset.id);
      return showTip(designTip(byId.get(dot.dataset.id)), r.left + r.width / 2, r.top);
    }
    const seg = e.target.closest('.seg[data-tip]');
    if (seg) { const r = seg.getBoundingClientRect(); showTip(h('div', {}, seg.dataset.tip), r.left + r.width / 2, r.top); }
  });
  document.addEventListener('focusout', () => { highlight(null); hideTip(); });
  addEventListener('scroll', hideTip, { passive: true });

  const host = $('#swarm');
  host.addEventListener('pointermove', e => {
    const row = e.target.closest('g[data-batch]');
    const dot = row && nearestDot(row, e);
    if (!dot) { hideTip(); highlight(null); return; }
    const r = dot.getBoundingClientRect();
    markLens(dot);
    highlight(dot.dataset.id);
    showTip(designTip(byId.get(dot.dataset.id)), r.left + r.width / 2, r.top);
  });
  host.addEventListener('pointerleave', () => { hideTip(); highlight(null); });

  let tid = 0;
  addEventListener('resize', () => { clearTimeout(tid); tid = setTimeout(renderSwarm, 150); });
}

renderHeader();
renderPicks();
renderSwarmText();
renderFunnel();
renderTableChrome();
renderTable();
renderEvidence();
renderFooter();
renderSwarm();
wire();
})();
</script>
