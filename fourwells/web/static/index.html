<!DOCTYPE html>

<title>FourWells</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header>
  <div class="wrap">
    <a class="brand" href="/">FourWells</a>
    <nav>
      <a href="/" data-nav="/">Overview</a>
      <a href="/runs" data-nav="/runs">Runs</a>
      <a href="/logs" data-nav="/logs">Call log</a>
